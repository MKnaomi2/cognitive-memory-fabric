[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "cognitive-memory-fabric"
version = "0.5.0"
description = "A local-first cognitive memory fabric for autonomous agents with provenance, temporal context, evidence-aware belief revision, reversible forgetting, Obsidian projections, and a hippocampal-inspired GPU replay engine"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "MKnaomi2" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Database",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.optional-dependencies]
holographic = ["numpy>=1.26"]
hermes = ["pyyaml>=6"]
obsidian = ["pyyaml>=6"]
neural = ["torch>=2.12,<2.13"]
observatory = [
  "fastapi>=0.115",
  "msgpack>=1.1",
  "uvicorn>=0.34",
  "websockets>=15",
]
dev = ["httpx2>=1", "pytest>=8", "ruff==0.15.22"]

[project.scripts]
cognitive-memory = "hippocampal_memory.cli:main"
hippocampal-memory = "hippocampal_memory.cli:legacy_main"

[tool.hatch.build.targets.wheel]
packages = ["src/hippocampal_memory"]

[tool.hatch.build.targets.wheel.force-include]
"benchmarks" = "hippocampal_memory/benchmarks"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py310"
