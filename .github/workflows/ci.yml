name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[holographic,obsidian,observatory,dev]"
      - run: python -m pytest -q
      - run: ruff check src tests integrations
      - run: python -m compileall -q src integrations
      - run: cognitive-memory evaluate run --profile ci --output "/tmp/cmf-eval-${{ github.run_id }}-${{ matrix.python-version }}"
      - run: cognitive-memory evaluate verify "/tmp/cmf-eval-${{ github.run_id }}-${{ matrix.python-version }}"

  python-neural:
    name: Python 3.11 neural and real Observatory
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: viewer/package-lock.json
      - run: python -m pip install --upgrade pip
      - run: python -m pip install "torch==2.12.1"
      - run: python -m pip install -e ".[holographic,hermes,obsidian,neural,observatory,dev]"
      - run: python -m pytest -q --junitxml=/tmp/pytest-neural.xml
      - run: python scripts/assert_pytest_counts.py /tmp/pytest-neural.xml --expected 65
      - run: python tests/observatory_integration.py
      - run: npm ci
        working-directory: viewer
      - run: npx playwright install --with-deps chromium
        working-directory: viewer
      - run: npm run e2e
        working-directory: viewer

  viewer:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: viewer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: viewer/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run lint
      - run: npm test
